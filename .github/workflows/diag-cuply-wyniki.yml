name: Test adaptera Cuply

on:
  push:
    branches:
      - feature/cuply-wyniki-adapter
    paths:
      - 'wyniki_news/cuply.py'
      - 'wyniki_news/build.py'
      - 'wyniki_news/README.md'
      - 'tests/wyniki_news/test_cuply.py'
      - '.github/workflows/diag-cuply-wyniki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5

      - name: Pełne testy modułu wyników
        run: python -m unittest discover -s tests/wyniki_news -v

      - name: Sprawdź składnię wtyczki WordPress
        run: php -l wordpress/tenis-net-wyniki/tenis-net-wyniki.php

      - name: Test importu WordPress
        run: php tests/wyniki_news/wordpress_import_test.php

      - name: Smoke test publicznych wyników Cuply
        run: |
          python - <<'PY'
          import json
          import requests
          from wyniki_news.cuply import fetch

          samples = [
              {
                  'label': 'grupy+QF+SF+F+3m',
                  'item': {'url': 'https://cuply.pl/turnieje/cuply-challenger-gryfino-i', 'nazwa': 'Cuply Challenger Gryfino I', 'data_od': '2026-09-06', 'data_do': '2026-09-06', 'miasto': 'Gryfino'},
                  'matches': 37,
                  'expected_side': 'osoba',
              },
              {
                  'label': 'grupy+SF+F',
                  'item': {'url': 'https://cuply.pl/turnieje/cuply-stargard-masters-zaawansowani-amatorzy', 'nazwa': 'Cuply Stargard Masters', 'data_od': '2026-08-30', 'data_do': '2026-08-30', 'miasto': 'Stargard'},
                  'matches': 23,
                  'expected_side': 'osoba',
              },
              {
                  'label': 'debel grupy+SF+F',
                  'item': {'url': 'https://cuply.pl/turnieje/duo-zoom-brejk-open-iii', 'nazwa': 'DUO ZOOM & BREJK Open III', 'data_od': '2026-05-09', 'data_do': '2026-05-09', 'miasto': 'Szczecin'},
                  'matches': 15,
                  'expected_side': 'para',
              },
          ]
          out = []
          with requests.Session() as session:
              for sample in samples:
                  result = fetch(sample['item'], session)
                  if len(result['mecze']) != sample['matches']:
                      raise SystemExit('Nieoczekiwana liczba meczów: ' + sample['label'] + ' ' + str(len(result['mecze'])))
                  if any(not m['zakonczony'] for m in result['mecze']):
                      raise SystemExit('Niepełny mecz: ' + sample['label'])
                  if any(m['strona_a']['typ'] != sample['expected_side'] or m['strona_b']['typ'] != sample['expected_side'] for m in result['mecze']):
                      raise SystemExit('Błędny typ strony: ' + sample['label'])
                  finals = [m for m in result['mecze'] if m['faza'].strip().casefold() in ('finał', 'final')]
                  if len(finals) != 1 or result['final_id'] != finals[0]['id']:
                      raise SystemExit('Brak pojedynczego finału: ' + sample['label'])
                  if result['uwagi']:
                      raise SystemExit('Ostrzeżenia: ' + sample['label'] + ' ' + repr(result['uwagi']))
                  out.append({'label': sample['label'], 'id': result['id'], 'mecze': len(result['mecze']), 'fazy': sorted(set(m['faza'] for m in result['mecze'])), 'kategoria': result['kategoria']})
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
