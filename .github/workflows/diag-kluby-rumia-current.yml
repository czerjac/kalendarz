name: Diagnoza aktualnego wpisu Rumia

on:
  push:
    paths:
      - ".github/workflows/diag-kluby-rumia-current.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pobierz aktualny kalendarz Kluby.org
        run: python kluby.py
      - name: Pokaż rekordy Rumii
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/turnieje_kluby.json',encoding='utf-8'))
          items=d.get('turnieje', d if isinstance(d,list) else [])
          for x in items:
              t=' '.join(str(x.get(k,'')) for k in ('nazwa','miasto','miejsce','url'))
              if 'rumia' in t.casefold() or 'powiatu wejherowskiego' in t.casefold():
                  print(json.dumps(x,ensure_ascii=False))
          PY
