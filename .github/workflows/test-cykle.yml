name: Test cykli

on:
  push:
    paths:
      - ".github/workflows/test-cykle.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Przelicz cykle
        run: python klasyfikacja.py
      - name: Sprawdź reguły
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/turnieje.json',encoding='utf-8'))
          items=data['turnieje']
          plt=[x for x in items if x.get('zrodlo')=='PLT']
          pzt=[x for x in items if x.get('zrodlo')=='PZT TOP']
          assert plt and all(x.get('cykl')=='Polska Liga Tenisa' for x in plt)
          assert pzt and all(x.get('cykl')=='TOP PZT' for x in pzt)
          print('PLT:', len(plt), '->', sorted({x.get('cykl') for x in plt}))
          print('PZT:', len(pzt), '->', sorted({x.get('cykl') for x in pzt}))
          print('CYKLE:', data.get('filtry',{}).get('cykle',[]))
          PY
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnieje.json
          git commit -m "Ujednolić cykle PLT i TOP PZT w danych"
          git pull --rebase origin main
          git push
