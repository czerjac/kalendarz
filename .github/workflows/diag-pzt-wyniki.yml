name: Test adaptera PZT TOP

on:
  push:
    branches:
      - feature/pzt-wyniki-adapter
    paths:
      - 'wyniki_news/pzt.py'
      - 'tests/wyniki_news/test_pzt.py'
      - '.github/workflows/diag-pzt-wyniki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Zainstaluj zależności
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Testy adaptera PZT
        run: python -m unittest tests.wyniki_news.test_pzt -v
      - name: Smoke test na publicznych wynikach PZT
        run: |
          python - <<'PY'
          import json
          import requests
          from wyniki_news.pzt import fetch

          samples = [
              {
                  'url': 'http://portal.pzt.pl/TournamentResults.aspx?CategoryID=AIS&TournamentID=7B170278-F7BB-4B0A-BEA5-49A199E798BC',
                  'nazwa': 'TOPSZLEM - TOP RZESZÓW OPEN',
                  'data_od': '2026-07-25', 'data_do': '2026-07-26',
                  'miasto': 'RZESZÓW', 'kategoria': '50+, Open Amator, Open'
              },
              {
                  'url': 'http://portal.pzt.pl/TournamentResults.aspx?CategoryID=AIS&TournamentID=9AEFB746-8C27-460A-B796-7B6FECB7676B',
                  'nazwa': 'LEGIA OPEN 2026',
                  'data_od': '2026-07-10', 'data_do': '2026-07-12',
                  'miasto': 'WARSZAWA', 'kategoria': '40+, 50+, 60+, 70+, Open Amator, Open'
              }
          ]
          out = []
          with requests.Session() as session:
              for item in samples:
                  result = fetch(item, session)
                  if not result['mecze']:
                      raise SystemExit('Brak meczów dla ' + item['nazwa'])
                  if not any(m['zakonczony'] for m in result['mecze']):
                      raise SystemExit('Brak zakończonych meczów dla ' + item['nazwa'])
                  out.append({
                      'id': result['id'],
                      'mecze': len(result['mecze']),
                      'zakonczone': sum(m['zakonczony'] for m in result['mecze']),
                      'single': sum(m['strona_a']['typ'] == 'osoba' for m in result['mecze']),
                      'pary': sum(m['strona_a']['typ'] == 'para' for m in result['mecze']),
                      'grupa': sum(m['typ_fazy'] == 'grupa' for m in result['mecze']),
                      'puchar': sum(m['typ_fazy'] == 'puchar' for m in result['mecze']),
                      'final_id': result['final_id'],
                      'gotowy': result['gotowy'],
                      'uwagi': result['uwagi'][:12]
                  })
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
