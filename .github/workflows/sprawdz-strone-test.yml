name: Sprawdź stronę kalendarza TEST

on:
  push:
    paths:
      - ".github/workflows/sprawdz-strone-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Zainstaluj Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Sprawdź stronę desktop i mobile
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          URL = "https://www.tenis.net.pl/amatorzy/kalendarz-turniejow-test"

          def visible_count(page, selector):
              return page.locator(selector).evaluate_all("els => els.filter(e => getComputedStyle(e).display !== 'none' && !e.hidden).length")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              console_errors=[]
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
              response = page.goto(URL, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(1500)

              print("=== DESKTOP ===")
              print("HTTP:", response.status if response else None)
              print("URL:", page.url)
              print("TITLE:", page.title())
              print("KALENDARZE:", page.locator('[data-tnk-calendar]').count())
              print("FILTRY:", page.locator('[data-tnk-filter]').count())
              print("LICZNIK:", page.locator('[data-tnk-count]').first.text_content() if page.locator('[data-tnk-count]').count() else 'BRAK')
              print("WIERSZE_WIDOCZNE:", visible_count(page, '.tnk-table [data-tnk-item]'))
              print("KARTY_WIDOCZNE_DESKTOP:", visible_count(page, '.tnk-cards [data-tnk-item]'))
              print("TABLE_DISPLAY:", page.locator('.tnk-table-wrap').evaluate("e => getComputedStyle(e).display") if page.locator('.tnk-table-wrap').count() else 'BRAK')
              print("CARDS_DISPLAY:", page.locator('.tnk-cards').evaluate("e => getComputedStyle(e).display") if page.locator('.tnk-cards').count() else 'BRAK')
              print("CONSOLE_ERRORS:", json.dumps(console_errors, ensure_ascii=False))

              for name in ['period','wojewodztwo','organizacja','cykl','rodzaj']:
                  el=page.locator(f'[data-tnk-filter="{name}"]')
                  if el.count():
                      opts=el.locator('option').all_text_contents()
                      print(f"OPCJE_{name.upper()}:", json.dumps(opts, ensure_ascii=False))

              rows=page.locator('.tnk-table .tnk-row:not(.tnk-item-hidden)')
              print("PIERWSZE_WIERSZE:")
              for i in range(min(3, rows.count())):
                  print(i+1, "|", " ".join(rows.nth(i).inner_text().split()))

              if rows.count():
                  btn=rows.nth(0).locator('[data-tnk-toggle]')
                  target_id=btn.get_attribute('data-tnk-toggle')
                  btn.click()
                  page.wait_for_timeout(300)
                  target=page.locator('#'+target_id)
                  print("SZCZEGOLY_OTWARTE:", target.is_visible())
                  print("PRZYCISK_PO_OTWARCIU:", btn.inner_text())
                  link=target.locator('a.tnk-link')
                  print("LINK_ZAPISY:", link.get_attribute('href') if link.count() else 'BRAK')

              woj=page.locator('[data-tnk-filter="wojewodztwo"]')
              if woj.count() and woj.locator('option').count()>1:
                  first_value=woj.locator('option').nth(1).get_attribute('value')
                  before=page.locator('[data-tnk-count]').inner_text()
                  woj.select_option(first_value)
                  page.wait_for_timeout(300)
                  after=page.locator('[data-tnk-count]').inner_text()
                  print("TEST_WOJ:", first_value, before, '->', after)
                  page.locator('[data-tnk-reset]').click()
                  page.wait_for_timeout(300)
                  print("RESET_PERIOD:", page.locator('[data-tnk-filter="period"]').input_value())
                  print("RESET_COUNT:", page.locator('[data-tnk-count]').inner_text())

              page.screenshot(path='desktop.png', full_page=True)

              mobile = browser.new_page(viewport={"width": 390, "height": 844})
              mobile.goto(URL, wait_until="networkidle", timeout=60000)
              mobile.wait_for_timeout(1500)
              print("=== MOBILE ===")
              print("TABLE_DISPLAY:", mobile.locator('.tnk-table-wrap').evaluate("e => getComputedStyle(e).display") if mobile.locator('.tnk-table-wrap').count() else 'BRAK')
              print("CARDS_DISPLAY:", mobile.locator('.tnk-cards').evaluate("e => getComputedStyle(e).display") if mobile.locator('.tnk-cards').count() else 'BRAK')
              print("KARTY_WIDOCZNE:", visible_count(mobile, '.tnk-cards [data-tnk-item]'))
              cards=mobile.locator('.tnk-card:not(.tnk-item-hidden)')
              if cards.count():
                  btn=cards.nth(0).locator('[data-tnk-toggle]')
                  target_id=btn.get_attribute('data-tnk-toggle')
                  btn.click(); mobile.wait_for_timeout(300)
                  print("MOBILE_SZCZEGOLY_OTWARTE:", mobile.locator('#'+target_id).is_visible())
              mobile.screenshot(path='mobile.png', full_page=True)

              browser.close()
          PY
      - name: Zapisz zrzuty ekranu
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-kalendarz-test
          path: |
            desktop.png
            mobile.png
