name: Napraw zapis zmian wtyczki wynikowej
on:
  push:
    branches: [feature/wyniki-redakcja-kategorie-tagi]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wyniki-redakcja-kategorie-tagi
      - name: Wykonaj patch i usuń techniczny znak z PHP
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          wf = Path('.github/workflows/patch-editorial-results.yml').read_text('utf-8')
          script = wf.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, '<editorial-patch>', 'exec'))
          php = Path('wordpress/tenis-net-wyniki/tenis-net-wyniki.php')
          text = php.read_text('utf-8')
          text = re.sub(r'(?m)^[ \t]*\\[ \t]*\n', '', text)
          php.write_text(text, 'utf-8')
          PY
      - name: Pełna regresja
        run: |
          python -m pip install requests beautifulsoup4
          python -m unittest discover -s tests/wyniki_news -v
          php -l wordpress/tenis-net-wyniki/tenis-net-wyniki.php
          php tests/wyniki_news/wordpress_import_test.php
      - name: Zapisz gotową zmianę
        run: |
          rm -f .github/workflows/patch-editorial-results.yml .github/workflows/fix-editorial-results.yml
          git config user.name "czerjac"
          git config user.email "czerjac@gmail.com"
          git add wyniki_news/build.py wordpress/tenis-net-wyniki/tenis-net-wyniki.php tests/wyniki_news .github/workflows
          git commit -m "Ulepsz format newsów oraz kategorie i tagi WordPress"
          git push origin HEAD:feature/wyniki-redakcja-kategorie-tagi
