name: Diagnostyka formatów wyników

on:
  push:
    paths:
      - '.github/workflows/diag-formaty-wynikow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Zainstaluj Chromium
        run: python -m playwright install --with-deps chromium

      - name: Zbierz próbki formatów wyników
        run: python diag_formaty_wynikow.py

      - name: Zbuduj krótkie podsumowanie diagnostyki
        run: python diag_formaty_podsumowanie.py

      - name: Zapisz diagnostykę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostyka_wynikow_2026.json data/diagnostyka_wynikow_2026_summary.json
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Zapisz diagnostykę formatów wyników"
            git pull --rebase origin main
            git push
          fi
