name: Test adaptera Kluby.org

on:
  push:
    branches:
      - feature/kluby-wyniki-adapter
    paths:
      - 'wyniki_news/kluby.py'
      - 'wyniki_news/build.py'
      - 'tests/wyniki_news/test_kluby.py'
      - '.github/workflows/test-kluby-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Zainstaluj zależności
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Testy jednostkowe
        run: python -m unittest tests.wyniki_news.test_kluby -v
      - name: Smoke test na publicznych wynikach Kluby.org
        run: |
          python - <<'PY'
          import json
          import requests
          from wyniki_news.kluby import fetch

          samples = [
              {
                  'url': 'https://kluby.org/turnieje/10368',
                  'nazwa': 'Debel Mikst 40+ Zima z Wars-em 2025/26',
                  'data_od': '2026-01-04', 'data_do': '2026-01-04',
                  'miasto': 'Warszawa', 'kategoria': 'DEBEL MIKST +40'
              },
              {
                  'url': 'https://kluby.org/turnieje/10824',
                  'nazwa': 'Noworoczny Turniej Mikstowy Ino-Cup 2026',
                  'data_od': '2026-01-10', 'data_do': '2026-01-10',
                  'miasto': 'Inowrocław', 'kategoria': 'DEBEL MIKST'
              }
          ]
          out = []
          with requests.Session() as session:
              for item in samples:
                  result = fetch(item, session)
                  if not result['mecze']:
                      raise SystemExit('Brak meczów dla ' + item['url'])
                  if not any(m['zakonczony'] for m in result['mecze']):
                      raise SystemExit('Brak potwierdzonego meczu dla ' + item['url'])
                  out.append({
                      'id': result['id'],
                      'mecze': len(result['mecze']),
                      'zakonczone': sum(m['zakonczony'] for m in result['mecze']),
                      'final_id': result['final_id'],
                      'gotowy': result['gotowy'],
                      'uwagi': result['uwagi'][:8],
                      'typy_faz': sorted(set(m['typ_fazy'] for m in result['mecze'])),
                      'pary': sum(m['strona_a']['typ'] == 'para' for m in result['mecze'])
                  })
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
