name: Import zakresu dat i celowany backfill

on:
  push:
    branches: [feature/wyniki-import-zakres-dat]
    paths:
      - '.github/workflows/range-import-backfill.yml'

permissions:
  contents: write

jobs:
  patch-test-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Zainstaluj zależności
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Popraw techniczny skrypt patchujący
        run: python tools/fix_patch_range_import.py
      - name: Zastosuj poprawkę
        run: python tools/patch_range_import.py
      - name: Testy Python
        run: python -m unittest discover -s tests/wyniki_news -v
      - name: Testy WordPress
        run: |
          php -l wordpress/tenis-net-wyniki/tenis-net-wyniki.php
          php -l wordpress/tenis-net-wyniki/tenis-net-wyniki-core.inc
          php tests/wyniki_news/wordpress_import_test.php
      - name: Backfill 29-30 sierpnia
        run: python -m wyniki_news.build --backfill --date-from 2026-08-29 --date-to 2026-08-30
      - name: Backfill 5-6 września
        run: python -m wyniki_news.build --backfill --date-from 2026-09-05 --date-to 2026-09-06
      - name: Zapisz sprawdzone zmiany na gałęzi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wyniki_news/build.py wordpress/tenis-net-wyniki/tenis-net-wyniki.php wordpress/tenis-net-wyniki/tenis-net-wyniki-core.inc tests/wyniki_news/wordpress_import_core_test.php tests/wyniki_news/test_date_range.py data/wyniki_news/
          git commit -m 'Dodaj import wyników z zakresu dat i uzupełnij dwa weekendy'
          git push origin HEAD:feature/wyniki-import-zakres-dat
      - name: Raport końcowy
        run: cat data/wyniki_news/raport.json >> "$GITHUB_STEP_SUMMARY"
