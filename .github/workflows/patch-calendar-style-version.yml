name: Podbij wersję kalendarza po zmianie stylu

on:
  push:
    branches:
      - feature/kalendarz-kolorystyka
    paths:
      - .github/workflows/patch-calendar-style-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/kalendarz-kolorystyka
      - name: Podbij wersję i usuń jednorazowy workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Version: 0.2.0', 'Version: 0.2.1', 1)
          s = s.replace("const VERSION = '0.2.0';", "const VERSION = '0.2.1';", 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/patch-calendar-style-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
          git commit -m 'Podbij wersję kalendarza do 0.2.1'
          git push origin HEAD:feature/kalendarz-kolorystyka
