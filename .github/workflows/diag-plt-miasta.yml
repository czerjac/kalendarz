name: Diagnostyka województw miast PLT
on:
  push:
    branches: [feature/plt-wojewodztwa-miasta]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ustal województwa miast PLT
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          data=json.loads(Path('data/archiwum/2026/turnieje.json').read_text(encoding='utf-8'))
          cities=sorted({str(x.get('miasto') or '').strip() for x in data.get('turnieje',[]) if x.get('zrodlo')=='PLT' and str(x.get('data_do') or x.get('data_od') or '')>'2026-07-01' and str(x.get('miasto') or '').strip()})
          out={}
          for city in cities:
              q=urllib.parse.urlencode({'q':f'{city}, Polska','format':'jsonv2','addressdetails':1,'limit':1,'countrycodes':'pl'})
              req=urllib.request.Request('https://nominatim.openstreetmap.org/search?'+q,headers={'User-Agent':'tenis-net-calendar-maintenance/1.0 (github.com/czerjac/kalendarz)'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      rows=json.load(r)
                  state=(rows[0].get('address') or {}).get('state','') if rows else ''
                  out[city]=state
              except Exception as e:
                  out[city]='ERROR:'+type(e).__name__
              time.sleep(1.05)
          print('PLT_CITY_STATE_JSON=' + json.dumps(out,ensure_ascii=False,sort_keys=True))
          print('COUNT='+str(len(cities)))
          PY