name: Test integracji Skandy

on:
  push:
    paths:
      - ".github/workflows/test-skanda-integracja.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pobierz Skandę
        run: python skanda.py
      - name: Zbuduj i przetwórz kalendarz
        run: |
          python build.py
          python regiony.py
          python szczegoly.py
          python klasyfikacja.py
          python normalizacja.py
          python jakosc.py
      - name: Sprawdź wynik
        run: |
          python - <<'PY'
          import json
          raw=json.load(open('data/turnieje_skanda.json',encoding='utf-8'))
          assert raw['liczba_turniejow'] == 9, raw['liczba_turniejow']
          data=json.load(open('data/turnieje.json',encoding='utf-8'))
          items=[x for x in data['turnieje'] if x.get('zrodlo')=='TKKF Skanda']
          assert len(items)==9, len(items)
          assert len({x['id'] for x in items})==9
          assert all(x.get('miasto')=='Olsztyn' for x in items)
          assert all(x.get('wojewodztwo')=='warmińsko-mazurskie' for x in items)
          assert all(x.get('organizator') for x in items)
          assert all(x.get('kontakt') for x in items)
          assert all(x.get('rodzaje_gry') for x in items)
          names={x['nazwa'] for x in items}
          assert 'Masters Grand Prix Skandy w grze pojedynczej' in names
          assert 'Olsztyn Masters Mikst - mistrzostwa Olsztyna w grze mieszanej (edycja czternasta)' in names
          assert not any('nie odbył' in x['nazwa'].casefold() or 'nie rozegrano' in x['nazwa'].casefold() for x in items)
          print('SKANDA FINAL:', len(items))
          for x in items:
              print(x['data_od'], '|', x['nazwa'], '| cykl=', x.get('cykl',''), '| gra=', x.get('rodzaje_gry'), '|', x['id'])
          print('RAZEM:', data['liczba_turniejow'])
          print('ŹRÓDŁA:', data.get('liczba_wg_zrodla'))
          print('CYKLE:', data.get('filtry',{}).get('cykle'))
          PY
      - name: Zapisz dane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Dodaj turnieje TKKF Skanda do kalendarza"
          git pull --rebase origin main
          git push
