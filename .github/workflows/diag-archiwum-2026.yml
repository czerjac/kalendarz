name: Diagnoza archiwum 2026

on:
  push:
    paths:
      - ".github/workflows/diag-archiwum-2026.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Diagnoza Cuply i PZT HTML
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          for name,url in [('CUPLY','https://cuply.pl/turnieje'),('PZT','https://top.pzt.pl/Kalendarz.aspx')]:
              print('\n===== '+name+' =====')
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
              r.encoding=r.apparent_encoding or r.encoding
              s=BeautifulSoup(r.text,'html.parser')
              print('status',r.status_code,'url',r.url)
              for f in s.find_all('form'):
                  print('FORM',f.get('method'),f.get('action'))
                  for el in f.find_all(['input','select','button']):
                      print(' FIELD',el.name,'name=',el.get('name'),'id=',el.get('id'),'value=',el.get('value'),'text=',el.get_text(' ',strip=True)[:100])
              print('LINKS/FIELDS CONTAIN FINISH:')
              for a in s.find_all('a',href=True):
                  t=a.get_text(' ',strip=True)
                  h=a.get('href')
                  if any(x in (t+' '+h).casefold() for x in ['zakończ','zakoncz','finish','past','archiw']):
                      print(t,'=>',h)
          PY
      - name: Diagnoza PLT finished i Kluby 2026
        run: |
          python - <<'PY'
          import json, calendar
          from datetime import date
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          import plt, kluby

          cats=plt.FALLBACK_CATEGORIES
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              c=b.new_context(locale='pl-PL',user_agent='Mozilla/5.0')
              page=c.new_page(); page.set_default_timeout(20000)
              print('\n===== PLT FINISHED =====')
              for cat,url in cats.items():
                  u=url+'?finished=true'
                  try:
                      page.goto(u,wait_until='domcontentloaded',timeout=45000)
                      items=plt.extract_cards(page,cat)
                      print(cat,len(items),u)
                  except Exception as e:
                      print(cat,'ERROR',type(e).__name__,e)
              print('\n===== KLUBY JAN-AUG 2026 =====')
              total=0
              for m in range(1,9):
                  last=calendar.monthrange(2026,m)[1]
                  params={'filtr':'1','opcja':'kalendarz','data_od':f'2026-{m:02d}-01','data_do':f'2026-{m:02d}-{last:02d}','zakladka':'0'}
                  u='https://kluby.org/tenis/turnieje?'+urlencode(params)
                  try:
                      page.goto(u,wait_until='domcontentloaded',timeout=45000)
                      items=kluby.extract_cards(page,u)
                      print(m,len(items),u)
                      total+=len(items)
                  except Exception as e:
                      print(m,'ERROR',type(e).__name__,e)
              print('KLUBY RAW TOTAL MONTHLY',total)
              b.close()
          PY
