name: Wzmocnij izolację CSS kalendarza dla Newspaper

on:
  push:
    branches:
      - feature/kalendarz-kolorystyka
    paths:
      - .github/workflows/patch-calendar-newspaper-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/kalendarz-kolorystyka
      - name: Wzmocnij selektory bez important
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wordpress/tenis-net-kalendarz/assets/calendar.css')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.tnk-field input,.tnk-field select{': '.tnk .tnk-field input,.tnk .tnk-field select{',
              '.tnk-field input:focus,.tnk-field select:focus{': '.tnk .tnk-field input:focus,.tnk .tnk-field select:focus{',
              '.tnk-table{': '.tnk .tnk-table{',
              '.tnk-table th{': '.tnk .tnk-table>thead>tr>th{',
              '.tnk-table td{': '.tnk .tnk-table>tbody>tr>td{',
              '.tnk-table tbody tr:last-child td{': '.tnk .tnk-table>tbody>tr:last-child>td{',
              '.tnk-details-button{': '.tnk .tnk-details-button{',
              '.tnk-details-button:hover{': '.tnk .tnk-details-button:hover{',
              '.tnk-details-button:focus-visible{': '.tnk .tnk-details-button:focus-visible{',
              '.tnk-details-button[aria-expanded="true"]{': '.tnk .tnk-details-button[aria-expanded="true"]{',
              '.tnk-link{': '.tnk .tnk-link{',
              '.tnk-link:hover{': '.tnk .tnk-link:hover{',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Brak oczekiwanego selektora: {old}')
              s = s.replace(old, new)
          s = s.replace(
              'cursor:pointer;white-space:nowrap;transition:',
              'cursor:pointer;white-space:nowrap;appearance:none;-webkit-appearance:none;box-shadow:none;text-shadow:none;line-height:1.2;transition:'
          )
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/patch-calendar-newspaper-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordpress/tenis-net-kalendarz/assets/calendar.css .github/workflows/patch-calendar-newspaper-compat.yml
          git commit -m 'Izoluj style kalendarza od motywu Newspaper'
          git push origin HEAD:feature/kalendarz-kolorystyka
