name: Diagnoza UI archiwum

on:
  push:
    paths:
      - ".github/workflows/diag-archive-ui.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Sprawdź Cuply, PLT i PZT
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          print('===== PZT WYNIKI =====')
          u='https://portal.pzt.pl/TournamentsResults.aspx?CategoryID=AIS'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          r.encoding=r.apparent_encoding or r.encoding
          s=BeautifulSoup(r.text,'html.parser')
          print('status',r.status_code,'tables',len(s.find_all('table')))
          for tr in s.find_all('tr')[:12]:
              cells=[' '.join(x.get_text(' ',strip=True).split()) for x in tr.find_all(['th','td'])]
              if cells: print('ROW',cells)

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              c=b.new_context(locale='pl-PL',user_agent='Mozilla/5.0')
              page=c.new_page(); page.set_default_timeout(20000)

              print('\n===== CUPLY =====')
              page.goto('https://cuply.pl/turnieje',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(1800)
              print('url before',page.url)
              print('buttons/text candidates:')
              for txt in page.locator('button, a').all_inner_texts():
                  t=' '.join(txt.split())
                  if any(k in t.casefold() for k in ['zakończ','zakoncz','nadchodz']): print(repr(t))
              try:
                  loc=page.get_by_text(re.compile('Zakończone',re.I),exact=True)
                  print('finished matches',loc.count())
                  if loc.count():
                      loc.first.click()
                      page.wait_for_timeout(1800)
                      print('url after',page.url)
                      print('turniej links',page.locator('a[href*="/turnieje/"]').count())
                      print('body sample',page.locator('body').inner_text()[:7000])
              except Exception as e:
                  print('CUPLY CLICK ERROR',type(e).__name__,e)

              print('\n===== PLT =====')
              u='https://polskaligatenisa.pl/turnieje/puchar-plt/lista-rund'
              page.goto(u,wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(1800)
              print('url before',page.url)
              for txt in page.locator('button, a').all_inner_texts():
                  t=' '.join(txt.split())
                  if any(k in t.casefold() for k in ['zakończ','zakoncz','nadchodz','wyniki']): print(repr(t))
              try:
                  loc=page.get_by_text(re.compile('Zakończone',re.I),exact=True)
                  print('finished matches',loc.count())
                  if loc.count():
                      loc.first.click()
                      page.wait_for_timeout(2200)
                      print('url after',page.url)
                      print('sprawdz wyniki',page.get_by_text(re.compile('Sprawdź wyniki',re.I)).count())
                      print('body sample',page.locator('body').inner_text()[:7000])
              except Exception as e:
                  print('PLT CLICK ERROR',type(e).__name__,e)
              b.close()
          PY
