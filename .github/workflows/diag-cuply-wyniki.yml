name: Diagnostyka wyników Cuply

on:
  push:
    branches:
      - feature/cuply-wyniki-adapter
    paths:
      - 'diag_cuply_wyniki.py'
      - 'diag_cuply_http.py'
      - '.github/workflows/diag-cuply-wyniki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install playwright==1.55.0 requests==2.32.5 beautifulsoup4==4.13.5

      - name: Sprawdź Livewire bez przeglądarki
        run: python diag_cuply_http.py

      - name: Zainstaluj Chromium
        run: python -m playwright install --with-deps chromium

      - name: Zbierz diagnostykę Cuply
        run: python diag_cuply_wyniki.py

      - name: Zapisz diagnostykę na gałęzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostyka_cuply_wyniki.json
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Zapisz diagnostykę wyników Cuply"
            git pull --rebase origin feature/cuply-wyniki-adapter
            git push origin HEAD:feature/cuply-wyniki-adapter
          fi
