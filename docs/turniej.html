<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szczegóły turnieju — Tenis NET</title>
  <style>
    :root{--bg:#f5f6f7;--card:#fff;--text:#1b1f23;--muted:#66707a;--line:#dde2e6;--accent:#b51f2a;--accent-dark:#8e1720;--soft:#f7ecee;--radius:14px;--shadow:0 4px 18px rgba(0,0,0,.06)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,Helvetica,sans-serif}.wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px}.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px}h1{font-size:clamp(28px,4vw,42px);line-height:1.12;margin:0 0 12px}.lead{font-size:18px;color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin:22px 0}.field{border-top:1px solid var(--line);padding-top:10px}.label{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.04em}.value{font-size:16px;font-weight:600;margin-top:3px}.pills{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.pill{font-size:13px;border:1px solid var(--line);background:#fafafa;padding:6px 9px;border-radius:999px}.cycle{background:var(--soft);border-color:#ebcbd0;color:var(--accent-dark);font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}.btn:hover{background:var(--accent-dark)}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.note{font-size:13px;color:var(--muted);margin-top:18px}.error{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted)}@media(max-width:620px){.wrap{padding:18px 12px 40px}.card{padding:18px}.grid{grid-template-columns:1fr}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="./">← Wróć do kalendarza</a>
    <div id="content"><div class="error">Ładowanie szczegółów turnieju…</div></div>
  </main>
<script>
const DATA_URL='https://raw.githubusercontent.com/czerjac/kalendarz/main/data/turnieje.json';
const params=new URLSearchParams(location.search);const id=params.get('id');
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const cap=(v='')=>v?v.charAt(0).toUpperCase()+v.slice(1):v;
const cycleOf=e=>(e.cykl||'').trim()||'brak';
const formatDate=(a,b)=>{if(!a)return '';const A=new Date(a+'T12:00:00'),B=new Date((b||a)+'T12:00:00');const opt={day:'numeric',month:'long',year:'numeric'};return a===(b||a)?A.toLocaleDateString('pl-PL',opt):A.toLocaleDateString('pl-PL',opt)+' – '+B.toLocaleDateString('pl-PL',opt)};
function field(label,value){return value?`<div class="field"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`:''}
async function init(){
  if(!id){document.querySelector('#content').innerHTML='<div class="error">Brak identyfikatora turnieju.</div>';return}
  try{
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const e=(data.turnieje||[]).find(x=>String(x.id)===id);
    if(!e){document.querySelector('#content').innerHTML='<div class="error">Nie znaleziono tego turnieju w aktualnym kalendarzu.</div>';return}
    document.title=e.nazwa+' — Tenis NET';
    const pills=[];pills.push(`<span class="pill cycle">Cykl: ${esc(cycleOf(e))}</span>`);if(e.kategorie)pills.push(`<span class="pill">${esc(e.kategorie)}</span>`);if(e.typ_gry)pills.push(`<span class="pill">${esc(e.typ_gry)}</span>`);if(e.poziom)pills.push(`<span class="pill">${esc(e.poziom)}</span>`);
    document.querySelector('#content').innerHTML=`<article class="card">
      <div class="eyebrow">Kalendarz turniejów amatorskich</div>
      <h1>${esc(e.nazwa)}</h1>
      <p class="lead">${esc(formatDate(e.data_od,e.data_do))}</p>
      <div class="grid">
        ${field('Miejscowość',e.miasto)}
        ${field('Województwo',e.wojewodztwo?cap(e.wojewodztwo):'do weryfikacji')}
        ${field('Obiekt / klub',e.miejsce)}
        ${field('Wpisowe',e.wpisowe)}
        ${field('Ranga',e.ranga)}
        ${field('Status',e.status==='nadchodzacy'?'nadchodzący':e.status)}
      </div>
      <div class="pills">${pills.join('')}</div>
      <div class="actions">
        ${e.url?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Zapisz się / strona turnieju</a>`:''}
        <a class="btn secondary" href="./">Wróć do kalendarza</a>
      </div>
      <div class="note">Dane wydarzenia są prezentowane w kalendarzu Tenis NET. Rejestracja i szczegółowe zasady pozostają na stronie organizatora lub systemu zapisów.</div>
    </article>`;
  }catch(err){document.querySelector('#content').innerHTML='<div class="error">Nie udało się pobrać danych turnieju.</div>'}
}
init();
</script>
</body>
</html>
