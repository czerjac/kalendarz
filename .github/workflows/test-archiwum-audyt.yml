name: Jednorazowy audyt archiwum 2026

on:
  push:
    paths:
      - ".github/workflows/test-archiwum-audyt.yml"

permissions:
  contents: write

jobs:
  audyt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Audyt
        run: python archiwum_audyt.py
      - name: Kontrola
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/archiwum/2026')
          data=json.load(open(root/'turnieje.json',encoding='utf-8'))
          report=json.load(open(root/'raport.json',encoding='utf-8'))
          dup=json.load(open(root/'duplikaty_do_weryfikacji.json',encoding='utf-8'))
          assert Path(root/'pzt_szczegoly.json').exists()
          assert report.get('audyt',{}).get('pzt_liczba',0) >= 100
          print('ARCHIWUM',data.get('liczba_turniejow_po_kontroli_jakosci'))
          print('AUDYT',report.get('audyt'))
          print('DUPLIKATY',dup.get('liczba'),dup.get('liczba_wg_pewnosci'))
          for x in dup.get('pary',[])[:20]:
              print(x.get('pewnosc'),x.get('data_a'),x.get('zrodlo_a'),x.get('nazwa_a'),' <=> ',x.get('zrodlo_b'),x.get('nazwa_b'),'|',x.get('miasto_a'),'/',x.get('miasto_b'),'|',x.get('zgodnosc_nazwy'))
          PY
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archiwum/2026
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Uzupełnij audyt archiwum 2026"
            git pull --rebase origin main
            git push
          fi
