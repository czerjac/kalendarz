name: Test fallbacku województw PLT
on:
  push:
    branches: [feature/plt-wojewodztwa-miasta]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Zależności
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Testy Python
        run: python -m unittest discover -s tests/wyniki_news -v
      - name: Testy WordPress
        run: |
          php -l wordpress/tenis-net-wyniki/tenis-net-wyniki.php
          php -l wordpress/tenis-net-wyniki/tenis-net-wyniki-core.inc
          php -l tests/wyniki_news/wordpress_import_test.php
          php tests/wyniki_news/wordpress_import_test.php
