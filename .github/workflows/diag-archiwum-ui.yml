name: Diagnoza archiwum UI

on:
  push:
    paths:
      - ".github/workflows/diag-archiwum-ui.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Sprawdź Cuply i PLT
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import plt
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              c=b.new_context(locale='pl-PL', user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36')
              page=c.new_page(); page.set_default_timeout(15000)

              print('=== CUPLY PAGINACJA ===')
              page.goto('https://cuply.pl/turnieje?sortuj=zakonczone', wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1600)
              for n in ['1','2','3']:
                  loc=page.get_by_text(n, exact=True)
                  print('NUM',n,'count',loc.count())
                  if loc.count():
                      for i in range(min(loc.count(),3)):
                          try:
                              print('HTML',n,i,loc.nth(i).evaluate('(e)=>e.outerHTML'))
                          except Exception as e: print('ERR',e)
              for u in ['https://cuply.pl/turnieje?sortuj=zakonczone&page=2','https://cuply.pl/turnieje?sortuj=zakonczone&strona=2']:
                  page.goto(u, wait_until='domcontentloaded', timeout=45000); page.wait_for_timeout(1200)
                  body=page.locator('body').inner_text()
                  m=re.search(r'Termin:\s*([^\n]+)',body)
                  print('CUPLY TEST URL',page.url,'first date',m.group(1) if m else 'NONE')

              print('=== PLT PO ZGODZIE ===')
              page.goto('https://polskaligatenisa.pl/turnieje/puchar-plt/lista-rund', wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(1200)
              consent=page.get_by_text('Przejdź do serwisu', exact=True)
              print('consent count',consent.count())
              if consent.count():
                  try:
                      consent.last.click(); page.wait_for_timeout(1800)
                  except Exception as e: print('consent click err',e)
              print('after consent finished text',page.get_by_text('Zakończone', exact=True).count())
              page.goto('https://polskaligatenisa.pl/turnieje/puchar-plt/lista-rund?finished=true', wait_until='domcontentloaded', timeout=45000)
              page.wait_for_timeout(3000)
              items=plt.extract_cards(page,'Puchar PLT')
              print('PLT FINISHED DIRECT',len(items),page.url)
              print(page.locator('body').inner_text()[:3500])
              b.close()
          PY
