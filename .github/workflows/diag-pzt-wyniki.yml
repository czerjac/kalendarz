name: Test adaptera PZT TOP

on:
  push:
    branches:
      - feature/pzt-wyniki-adapter
    paths:
      - 'wyniki_news/pzt.py'
      - 'tests/wyniki_news/test_pzt.py'
      - '.github/workflows/diag-pzt-wyniki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Zainstaluj zależności
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Testy adaptera PZT
        run: python -m unittest tests.wyniki_news.test_pzt -v
      - name: Smoke test na publicznych wynikach PZT
        run: |
          python - <<'PY'
          import json
          import requests
          from wyniki_news.pzt import (
              BASE, extract_match_urls, fetch, final_match, get,
              parse_event, parse_winners, side_names, verify_final
          )

          samples = [
              {
                  'url': 'http://portal.pzt.pl/TournamentResults.aspx?CategoryID=AIS&TournamentID=7B170278-F7BB-4B0A-BEA5-49A199E798BC',
                  'nazwa': 'TOPSZLEM - TOP RZESZÓW OPEN',
                  'data_od': '2026-07-25', 'data_do': '2026-07-26',
                  'miasto': 'RZESZÓW', 'kategoria': '50+, Open Amator, Open'
              },
              {
                  'url': 'http://portal.pzt.pl/TournamentResults.aspx?CategoryID=AIS&TournamentID=9AEFB746-8C27-460A-B796-7B6FECB7676B',
                  'nazwa': 'LEGIA OPEN 2026',
                  'data_od': '2026-07-10', 'data_do': '2026-07-12',
                  'miasto': 'WARSZAWA', 'kategoria': '40+, 50+, 60+, 70+, Open Amator, Open'
              }
          ]
          out = []
          with requests.Session() as session:
              for item in samples:
                  result = fetch(item, session)
                  if not result['mecze']:
                      raise SystemExit('Brak meczów dla ' + item['nazwa'])
                  if not any(m['zakonczony'] for m in result['mecze']):
                      raise SystemExit('Brak zakończonych meczów dla ' + item['nazwa'])
                  out.append({
                      'id': result['id'],
                      'mecze': len(result['mecze']),
                      'zakonczone': sum(m['zakonczony'] for m in result['mecze']),
                      'single': sum(m['strona_a']['typ'] == 'osoba' for m in result['mecze']),
                      'pary': sum(m['strona_a']['typ'] == 'para' for m in result['mecze']),
                      'grupa': sum(m['typ_fazy'] == 'grupa' for m in result['mecze']),
                      'puchar': sum(m['typ_fazy'] == 'puchar' for m in result['mecze']),
                      'final_id': result['final_id'],
                      'gotowy': result['gotowy'],
                      'uwagi': result['uwagi'][:12]
                  })

              tid = '7B170278-F7BB-4B0A-BEA5-49A199E798BC'
              index = get(session, BASE + f'TournamentMatchesPlay.aspx?CategoryID=AIS&Male=&TournamentID={tid}')
              winners = parse_winners(get(session, BASE + f'TournamentTabResults.aspx?CategoryID=AIS&Male=&TournamentID={tid}'))
              diag = []
              for url in extract_match_urls(index):
                  meta, matches, warnings = parse_event(get(session, url), url)
                  finals = final_match(matches)
                  local = []
                  fid = verify_final(matches, winners.get(meta['klucz']), local) if finals else None
                  final = finals[0] if len(finals) == 1 else None
                  win = final['strona_' + final['zwyciezca']] if final else None
                  lose = final['strona_' + ('b' if final and final['zwyciezca'] == 'a' else 'a')] if final else None
                  standing = winners.get(meta['klucz'], {})
                  diag.append({
                      'meta': meta,
                      'final_winner': sorted(side_names(win)) if win else [],
                      'final_loser': sorted(side_names(lose)) if lose else [],
                      'standing_1': sorted(side_names(standing.get('miejsca', {}).get('1'))),
                      'standing_2': sorted(side_names(standing.get('miejsca', {}).get('2'))),
                      'verified_final': fid,
                      'issues': local,
                  })
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print('RZESZOW_FINAL_DIAG')
          print(json.dumps(diag, ensure_ascii=False, indent=2))
          PY
