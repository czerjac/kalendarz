name: Aktualizacja kalendarza

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: kalendarz-aktualizacja
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Zainstaluj Chromium dla stron JavaScript
        run: python -m playwright install --with-deps chromium

      - name: Pobierz turnieje PZT
        continue-on-error: true
        run: python pzt.py

      - name: Pobierz turnieje Cuply
        continue-on-error: true
        run: python cuply.py

      - name: Pobierz turnieje PLT
        continue-on-error: true
        run: python plt.py

      - name: Pobierz turnieje Kluby.org
        continue-on-error: true
        run: python kluby.py

      - name: Zbuduj wspólny kalendarz
        run: python build.py

      - name: Przypisz województwa
        continue-on-error: true
        run: python regiony.py

      - name: Pobierz i zapamiętaj szczegóły
        continue-on-error: true
        run: python szczegoly.py

      - name: Zapisz wynik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "Automatyczna aktualizacja kalendarza"
            git pull --rebase origin main
            git push
          fi
