name: Zbuduj wtyczkę 0.1.2

on:
  push:
    paths:
      - ".github/workflows/zbuduj-plugin-012.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Popraw link PLT
        run: |
          python -c 'from pathlib import Path; p=Path("wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php"); s=p.read_text(encoding="utf-8"); s=s.replace("Version: 0.1.1","Version: 0.1.2").replace("const VERSION = '\''0.1.1'\'';","const VERSION = '\''0.1.2'\'';"); old="    private static function details_url($item) {\n        if (!empty($item['\''zapisy_url'\''])) return esc_url($item['\''zapisy_url'\'']);\n        if (!empty($item['\''url'\''])) return esc_url($item['\''url'\'']);\n        return '\'''\'';\n    }\n"; new="    private static function details_url($item) {\n        // PLT: najpierw strona konkretnego turnieju, nie formularz rejestracji.\n        if (!empty($item['\''zrodlo'\'']) && $item['\''zrodlo'\''] === '\''PLT'\'' && !empty($item['\''url'\''])) {\n            return esc_url($item['\''url'\'']);\n        }\n        if (!empty($item['\''zapisy_url'\''])) return esc_url($item['\''zapisy_url'\'']);\n        if (!empty($item['\''url'\''])) return esc_url($item['\''url'\'']);\n        return '\'''\'';\n    }\n"; assert old in s, "Nie znaleziono details_url"; p.write_text(s.replace(old,new,1),encoding="utf-8"); r=Path("wordpress/tenis-net-kalendarz/readme.txt"); r.write_text(r.read_text(encoding="utf-8").replace("0.1.1","0.1.2"),encoding="utf-8")'
      - name: Test składni
        run: |
          php -l wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
          grep -q "zrodlo.*PLT" wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
      - name: Zapisz wersję 0.1.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/tenis-net-kalendarz
          git commit -m "Popraw link do strony turnieju PLT 0.1.2"
          git pull --rebase origin main
          git push
      - name: Zbuduj ZIP
        run: |
          cd wordpress
          zip -qr tenis-net-kalendarz-0.1.2.zip tenis-net-kalendarz
      - name: Udostępnij ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tenis-net-kalendarz-0.1.2
          path: wordpress/tenis-net-kalendarz-0.1.2.zip
