name: Zbuduj wtyczkę 0.2.0

on:
  push:
    paths:
      - ".github/workflows/zbuduj-plugin-020.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Podepnij moduł ręcznych turniejów
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Version: 0.1.2','Version: 0.2.0',1)
          s=s.replace("const VERSION = '0.1.2';","const VERSION = '0.2.0';",1)
          anchor="if (!defined('ABSPATH')) {\n    exit;\n}\n"
          assert anchor in s
          s=s.replace(anchor, anchor+"\nrequire_once plugin_dir_path(__FILE__) . 'includes/manual-tournaments.php';\n",1)
          anchor="    public static function init() {\n"
          assert anchor in s
          s=s.replace(anchor, anchor+"        Tenis_NET_Kalendarz_Manual::init();\n",1)
          anchor="    public static function activate() {\n"
          assert anchor in s
          s=s.replace(anchor, anchor+"        Tenis_NET_Kalendarz_Manual::register_post_type();\n",1)
          anchor="        $items = isset($data['turnieje']) && is_array($data['turnieje']) ? $data['turnieje'] : array();\n"
          assert anchor in s
          s=s.replace(anchor, anchor+"        $items = array_merge($items, Tenis_NET_Kalendarz_Manual::items());\n",1)
          old='<p>Wstaw shortcode <code>[tenis_kalendarz]</code> w treści dowolnej strony WordPress.</p>'
          new='<p>Wstaw shortcode <code>[tenis_kalendarz]</code> w treści strony kalendarza.</p>\n            <p>Turnieje spoza źródeł automatycznych dodasz przez <strong>Kalendarz turniejów → Dodaj turniej</strong>.</p>'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Zaktualizuj readme
        run: |
          cat > wordpress/tenis-net-kalendarz/readme.txt <<'EOF'
          Tenis NET – Kalendarz turniejów amatorskich
          ============================================

          Wersja: 0.2.0

          Instalacja / aktualizacja
          ------------------------
          1. WordPress → Wtyczki → Dodaj nową → Wyślij wtyczkę na serwer.
          2. Wybierz ZIP i zastąp obecną wersję wtyczki.
          3. Shortcode pozostaje bez zmian: [tenis_kalendarz]

          Ręczne turnieje
          ---------------
          WordPress → Kalendarz turniejów → Dodaj turniej

          Nazwa turnieju jest tytułem wpisu. Opis wpisujemy w głównym edytorze WordPress. Dane turnieju znajdują się w sekcji „Dane turnieju”. Do publicznego kalendarza trafiają tylko opublikowane ręczne turnieje, których data zakończenia jeszcze nie minęła.

          Wersja 0.2.0
          ------------
          - wszystkie funkcje wersji 0.1.2,
          - ręczne dodawanie turniejów w WordPressie,
          - szkice nie są publikowane w kalendarzu,
          - ręczne turnieje są łączone z automatycznym turnieje.json,
          - ręczne cykle automatycznie trafiają do filtra Cykl,
          - ręczne turnieje korzystają z tych samych filtrów, tabeli, kart i szczegółów,
          - lista administracyjna pokazuje termin, miasto i cykl.

          Ustawienia
          ----------
          WordPress → Ustawienia → Kalendarz Tenis NET
          EOF
          sed -i 's/^          //' wordpress/tenis-net-kalendarz/readme.txt
      - name: Test składni
        run: |
          php -l wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
          php -l wordpress/tenis-net-kalendarz/includes/manual-tournaments.php
          node --check wordpress/tenis-net-kalendarz/assets/calendar.js
          grep -q "Tenis_NET_Kalendarz_Manual::items" wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
          grep -q "register_post_type" wordpress/tenis-net-kalendarz/includes/manual-tournaments.php
      - name: Zapisz wersję 0.2.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/tenis-net-kalendarz
          git commit -m "Dodaj ręczne turnieje w WordPressie 0.2.0"
          git pull --rebase origin main
          git push
      - name: Zbuduj ZIP
        run: |
          cd wordpress
          zip -qr tenis-net-kalendarz-0.2.0.zip tenis-net-kalendarz
      - name: Udostępnij ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tenis-net-kalendarz-0.2.0
          path: wordpress/tenis-net-kalendarz-0.2.0.zip
