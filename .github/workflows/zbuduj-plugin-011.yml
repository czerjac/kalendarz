name: Zbuduj wtyczkę 0.1.1

on:
  push:
    paths:
      - ".github/workflows/zbuduj-plugin-011.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Popraw interfejs wtyczki
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          php_path=Path('wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php')
          css_path=Path('wordpress/tenis-net-kalendarz/assets/calendar.css')
          readme_path=Path('wordpress/tenis-net-kalendarz/readme.txt')

          php=php_path.read_text(encoding='utf-8')
          php=php.replace('Version: 0.1.0', 'Version: 0.1.1')
          php=php.replace("const VERSION = '0.1.0';", "const VERSION = '0.1.1';")

          php,n=re.subn(
              r'<div class="tnk-header"><div><h2>.*?</h2><p class="tnk-lead">.*?</p></div><div class="tnk-meta">',
              '<div class="tnk-header"><div><p class="tnk-lead">Turnieje amatorskie z całej Polski w jednym miejscu.</p></div><div class="tnk-meta">',
              php, count=1, flags=re.S)
          assert n==1, 'Nie znaleziono nagłówka wtyczki'

          php,n=re.subn(
              r'\s*<label class="tnk-field"><span>Organizacja</span><select data-tnk-filter="organizacja">.*?</select></label>',
              '', php, count=1, flags=re.S)
          assert n==1, 'Nie znaleziono filtra Organizacja'

          old='<thead><tr><th>Data</th><th>Turniej</th><th>Miejscowość</th><th>Organizacja</th><th>Kategorie</th><th></th></tr></thead>'
          new='<thead><tr><th>Data</th><th>Turniej</th><th>Miejscowość</th><th>Kategorie</th><th></th></tr></thead>'
          assert old in php, 'Nie znaleziono nagłówka tabeli'
          php=php.replace(old,new,1)

          php,n=re.subn(r'<td><span class="tnk-source">.*?</span></td>', '', php, count=1, flags=re.S)
          assert n==1, 'Nie znaleziono kolumny źródła w tabeli'
          php=re.sub(r'<span class="tnk-source">.*?</span>', '', php, flags=re.S)
          php=php.replace('colspan="6"','colspan="5"')
          php=php.replace('Szczegóły / zapisy ↗','Zapisz się / strona turnieju ↗')
          php=php.replace('Turniej, miasto, organizator…','Turniej, miasto, cykl…')
          php_path.write_text(php,encoding='utf-8')

          css=css_path.read_text(encoding='utf-8')
          css=css.replace('grid-template-columns:2fr repeat(5,minmax(140px,1fr))','grid-template-columns:2fr repeat(4,minmax(140px,1fr))')
          css_path.write_text(css,encoding='utf-8')

          readme=readme_path.read_text(encoding='utf-8')
          readme=readme.replace('0.1.0','0.1.1')
          readme_path.write_text(readme,encoding='utf-8')
          PY
      - name: Test składni
        run: |
          php -l wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
          node --check wordpress/tenis-net-kalendarz/assets/calendar.js
          grep -R "data-tnk-filter=\"organizacja\"\|<th>Organizacja</th>\|class=\"tnk-source\"" wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php && exit 1 || true
          grep -q "Zapisz się / strona turnieju" wordpress/tenis-net-kalendarz/tenis-net-kalendarz.php
      - name: Zapisz wersję 0.1.1 w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/tenis-net-kalendarz
          git commit -m "Popraw interfejs wtyczki kalendarza 0.1.1"
          git pull --rebase origin main
          git push
      - name: Zbuduj ZIP
        run: |
          cd wordpress
          zip -qr tenis-net-kalendarz-0.1.1.zip tenis-net-kalendarz
      - name: Udostępnij ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tenis-net-kalendarz-0.1.1
          path: wordpress/tenis-net-kalendarz-0.1.1.zip
