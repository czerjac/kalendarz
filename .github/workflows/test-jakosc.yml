name: Test kontroli jakości

on:
  push:
    paths:
      - ".github/workflows/test-jakosc.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Zainstaluj requests
        run: pip install requests
      - name: Uruchom kontrolę jakości
        run: python jakosc.py
      - name: Pokaż odrzucone
        run: cat data/odrzucone_jakosc.json
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnieje.json data/odrzucone_jakosc.json
          git commit -m "Zastosuj kontrolę jakości do bieżącego kalendarza"
          git pull --rebase origin main
          git push
