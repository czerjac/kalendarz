name: Diagnoza formatów wyników

on:
  push:
    paths:
      - "diag_wyniki_probki.py"
      - ".github/workflows/diag-wyniki-probki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Zainstaluj Chromium
        run: python -m playwright install --with-deps chromium

      - name: Pobierz próbki i rozpoznaj formaty
        run: python diag_wyniki_probki.py

      - name: Zapisz raport diagnostyczny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archiwum/2026/diag_wyniki_probki.json
          if git diff --cached --quiet; then
            echo "Brak zmian raportu."
          else
            git commit -m "Zapisz próbki formatów wyników"
            git pull --rebase origin main
            git push
          fi
