name: Test archiwum 2026

on:
  push:
    paths:
      - ".github/workflows/test-archiwum-2026.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Sprawdź składnię
        run: python -m py_compile archiwum_2026.py
      - name: Zbuduj archiwum 2026
        run: python archiwum_2026.py
      - name: Sprawdź pliki wynikowe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/archiwum/2026')
          data=json.load(open(root/'turnieje.json',encoding='utf-8'))
          report=json.load(open(root/'raport.json',encoding='utf-8'))
          assert data['liczba_turniejow_po_kontroli_jakosci'] > 100
          assert Path(root/'duplikaty_do_weryfikacji.json').exists()
          assert not report['bledy_zrodel'], report['bledy_zrodel']
          print('ARCHIWUM:',data['liczba_turniejow_po_kontroli_jakosci'])
          print('ŹRÓDŁA:',data['liczba_wg_zrodla'])
          print('STATUSY:',data['liczba_wg_statusu_archiwum'])
          print('DUPLIKATY:',data['liczba_potencjalnych_par_duplikatow'])
          print('ODRZUCONE:',report['liczba_odrzuconych_jakosc'])
          PY
      - name: Zapisz backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archiwum/2026
          git commit -m "Zbuduj archiwum turniejów 2026"
          git pull --rebase origin main
          git push
